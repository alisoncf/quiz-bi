<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — Inteligência de Negócio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111009;
        --paper: #f7f4ee;
        --paper2: #efeae0;
        --paper3: #e5dfd2;
        --red: #c0392b;
        --blue: #1a4fa0;
        --green: #1a6840;
        --gold: #b8860b;
        --border: #c8bfaa;
        --muted: #7a7060;
        --radius: 4px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        font-weight: 300;
        min-height: 100vh;
      }

      /* ── COVER ── */
      #cover {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      #cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 39px,
            var(--paper3) 39px,
            var(--paper3) 40px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 39px,
            var(--paper3) 39px,
            var(--paper3) 40px
          );
        opacity: 0.5;
        pointer-events: none;
      }

      .cover-inner {
        position: relative;
        z-index: 1;
        max-width: 560px;
      }

      .cover-tag {
        display: inline-block;
        background: var(--ink);
        color: var(--paper);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 5px 14px;
        border-radius: 2px;
        margin-bottom: 28px;
      }

      .cover-title {
        font-family: "Instrument Serif", serif;
        font-size: clamp(2.8rem, 8vw, 5rem);
        line-height: 1;
        margin-bottom: 8px;
        letter-spacing: -0.01em;
      }

      .cover-title em {
        font-style: italic;
        color: var(--red);
      }

      .cover-subtitle {
        font-size: 0.95rem;
        color: var(--muted);
        margin-bottom: 36px;
        line-height: 1.6;
      }

      .cover-meta {
        display: flex;
        gap: 24px;
        justify-content: center;
        margin-bottom: 36px;
        flex-wrap: wrap;
      }

      .cover-meta-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .cover-meta-item .val {
        font-family: "Instrument Serif", serif;
        font-size: 2rem;
        line-height: 1;
      }

      .cover-meta-item .lbl {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .divider {
        width: 1px;
        height: 40px;
        background: var(--border);
        align-self: center;
      }

      /* Name input */
      .name-wrap {
        margin-bottom: 24px;
        text-align: left;
      }

      .name-label {
        display: block;
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .name-input {
        width: 100%;
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 13px 16px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        font-weight: 400;
        color: var(--ink);
        background: var(--paper);
        transition: border-color 0.15s;
      }

      .name-input:focus {
        outline: none;
        border-color: var(--ink);
      }
      .name-input::placeholder {
        color: var(--border);
      }
      .name-input.error {
        border-color: var(--red);
      }

      .name-error {
        font-size: 0.78rem;
        color: var(--red);
        margin-top: 6px;
        display: none;
      }
      .name-error.visible {
        display: block;
      }

      .btn-start {
        width: 100%;
        background: var(--ink);
        color: var(--paper);
        border: none;
        padding: 16px 48px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        cursor: pointer;
        border-radius: var(--radius);
        transition:
          background 0.2s,
          transform 0.15s;
      }

      .btn-start:hover {
        background: var(--red);
        transform: translateY(-2px);
      }

      /* ── QUIZ SHELL ── */
      #quiz-shell {
        display: none;
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      .top-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 36px;
        padding-bottom: 16px;
        border-bottom: 1.5px solid var(--border);
      }

      .quiz-label {
        font-family: "Instrument Serif", serif;
        font-size: 1.2rem;
        flex: 1;
        color: var(--muted);
      }
      .q-counter {
        font-family: "DM Mono", monospace;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .prog-track {
        flex: 1;
        height: 3px;
        background: var(--paper3);
        border-radius: 2px;
        overflow: hidden;
      }
      .prog-fill {
        height: 100%;
        background: var(--ink);
        border-radius: 2px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        width: 0%;
      }

      .q-block {
        animation: qIn 0.35s ease;
      }
      @keyframes qIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .q-topic {
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .q-num {
        font-family: "Instrument Serif", serif;
        font-size: 0.95rem;
        color: var(--red);
        margin-bottom: 6px;
      }
      .q-text {
        font-family: "Instrument Serif", serif;
        font-size: 1.35rem;
        line-height: 1.5;
        margin-bottom: 28px;
        letter-spacing: -0.01em;
      }

      .options-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 32px;
      }

      .opt-btn {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        background: var(--paper);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        text-align: left;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        font-weight: 300;
        color: var(--ink);
        line-height: 1.5;
        transition:
          border-color 0.15s,
          background 0.15s;
        width: 100%;
      }
      .opt-btn:hover:not(:disabled) {
        border-color: var(--ink);
        background: var(--paper2);
      }
      .opt-letter {
        font-family: "DM Mono", monospace;
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--muted);
        min-width: 18px;
        margin-top: 2px;
        flex-shrink: 0;
      }
      .opt-btn.selected {
        border-color: var(--ink);
        background: var(--paper2);
      }
      .opt-btn.correct {
        border-color: var(--green);
        background: #edf7f0;
      }
      .opt-btn.correct .opt-letter {
        color: var(--green);
      }
      .opt-btn.wrong {
        border-color: var(--red);
        background: #fdf0ef;
      }
      .opt-btn.wrong .opt-letter {
        color: var(--red);
      }
      .opt-btn.reveal-correct {
        border-color: var(--green);
        background: #edf7f0;
        opacity: 0.7;
      }
      .opt-btn:disabled {
        cursor: default;
      }

      .feedback-box {
        display: none;
        background: var(--paper2);
        border-left: 3px solid var(--ink);
        border-radius: 0 var(--radius) var(--radius) 0;
        padding: 14px 16px;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--ink);
        margin-bottom: 28px;
        animation: qIn 0.25s ease;
      }
      .feedback-box.visible {
        display: block;
      }
      .feedback-box.fb-correct {
        border-color: var(--green);
      }
      .feedback-box.fb-wrong {
        border-color: var(--red);
      }
      .fb-label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .fb-correct .fb-label {
        color: var(--green);
      }
      .fb-wrong .fb-label {
        color: var(--red);
      }

      .q-nav {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .btn-confirm,
      .btn-next {
        padding: 11px 28px;
        border-radius: var(--radius);
        font-family: "DM Sans", sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        border: 1.5px solid var(--ink);
      }
      .btn-confirm {
        background: var(--ink);
        color: var(--paper);
      }
      .btn-confirm:hover {
        background: var(--red);
        border-color: var(--red);
      }
      .btn-confirm:disabled {
        background: var(--border);
        border-color: var(--border);
        color: var(--muted);
        cursor: not-allowed;
      }
      .btn-next {
        background: transparent;
        color: var(--ink);
      }
      .btn-next:hover {
        background: var(--ink);
        color: var(--paper);
      }

      /* ── RESULTS ── */
      #results {
        display: none;
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      .result-hero {
        text-align: center;
        padding: 48px 20px 40px;
        border-bottom: 1.5px solid var(--border);
        margin-bottom: 36px;
      }
      .result-hero .score-big {
        font-family: "Instrument Serif", serif;
        font-size: clamp(4rem, 12vw, 7rem);
        line-height: 1;
      }
      .result-hero .score-label {
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 20px;
      }
      .result-hero .score-verdict {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 1.4rem;
        color: var(--red);
        margin-bottom: 8px;
      }
      .result-hero .score-sub {
        font-size: 0.875rem;
        color: var(--muted);
      }

      .result-breakdown {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--border);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 40px;
      }
      .breakdown-cell {
        background: var(--paper);
        padding: 18px 16px;
        text-align: center;
      }
      .breakdown-cell .bc-val {
        font-family: "Instrument Serif", serif;
        font-size: 2rem;
        line-height: 1;
        margin-bottom: 4px;
      }
      .breakdown-cell .bc-lbl {
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bc-green .bc-val {
        color: var(--green);
      }
      .bc-red .bc-val {
        color: var(--red);
      }
      .bc-gold .bc-val {
        color: var(--gold);
      }

      /* Send box */
      .send-box {
        background: var(--paper2);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 40px;
        text-align: center;
      }

      .send-box h3 {
        font-family: "Instrument Serif", serif;
        font-size: 1.2rem;
        margin-bottom: 6px;
      }

      .send-box p {
        font-size: 0.875rem;
        color: var(--muted);
        margin-bottom: 20px;
        line-height: 1.6;
      }

      .send-name-display {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 16px;
      }

      .send-name-display strong {
        color: var(--ink);
      }

      .btn-send {
        background: var(--ink);
        color: var(--paper);
        border: none;
        padding: 13px 36px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        border-radius: var(--radius);
        transition: all 0.15s;
      }

      .btn-send:hover {
        background: var(--green);
        transform: translateY(-1px);
      }
      .btn-send:disabled {
        background: var(--border);
        cursor: not-allowed;
        transform: none;
      }

      .send-status {
        margin-top: 14px;
        font-size: 0.85rem;
        min-height: 20px;
        line-height: 1.5;
      }

      .send-status.sending {
        color: var(--muted);
      }
      .send-status.success {
        color: var(--green);
        font-weight: 500;
      }
      .send-status.error {
        color: var(--red);
      }

      .review-title {
        font-family: "Instrument Serif", serif;
        font-size: 1.4rem;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      .review-item {
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 12px;
      }
      .review-header {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 14px 16px;
        background: var(--paper2);
        cursor: pointer;
      }
      .review-status {
        font-family: "DM Mono", monospace;
        font-size: 0.8rem;
        font-weight: 500;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .status-c {
        color: var(--green);
      }
      .status-w {
        color: var(--red);
      }
      .review-qtext {
        font-size: 0.9rem;
        line-height: 1.5;
        flex: 1;
      }
      .review-body {
        display: none;
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        font-size: 0.855rem;
        line-height: 1.6;
      }
      .review-body.open {
        display: block;
      }
      .review-your,
      .review-correct-ans {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .review-your-val {
        margin-bottom: 10px;
      }
      .review-correct-ans-val {
        color: var(--green);
        margin-bottom: 10px;
        font-weight: 500;
      }
      .review-exp {
        color: var(--muted);
        font-style: italic;
      }

      .btn-restart {
        display: block;
        margin: 40px auto 0;
        background: transparent;
        border: 1.5px solid var(--ink);
        color: var(--ink);
        padding: 12px 32px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        border-radius: var(--radius);
        transition: all 0.15s;
      }
      .btn-restart:hover {
        background: var(--ink);
        color: var(--paper);
      }

      @media (max-width: 560px) {
        .result-breakdown {
          grid-template-columns: 1fr;
        }
        .q-text {
          font-size: 1.15rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- COVER -->
    <div id="cover">
      <div class="cover-inner">
        <div class="cover-tag">Avaliação · Aulas 1–10</div>
        <h1 class="cover-title">Inteligência<br />de <em>Negócio</em></h1>
        <p class="cover-subtitle">
          Fundamentos, análise descritiva e pré-processamento de dados.<br />Responda
          com atenção — cada questão conta.
        </p>
        <div class="cover-meta">
          <div class="cover-meta-item">
            <span class="val">20</span><span class="lbl">Questões</span>
          </div>
          <div class="divider"></div>
          <div class="cover-meta-item">
            <span class="val">4</span><span class="lbl">Alternativas</span>
          </div>
          <div class="divider"></div>
          <div class="cover-meta-item">
            <span class="val">~30</span><span class="lbl">Minutos</span>
          </div>
        </div>

        <div class="name-wrap">
          <label class="name-label" for="student-name">Seu nome completo</label>
          <input
            class="name-input"
            type="text"
            id="student-name"
            placeholder="Ex: Maria Silva"
            autocomplete="name"
          />
          <div class="name-error" id="name-error">
            Por favor, informe seu nome antes de começar.
          </div>
        </div>

        <button class="btn-start" onclick="startQuiz()">
          Iniciar avaliação →
        </button>
      </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz-shell">
      <div class="top-bar">
        <span class="quiz-label">Inteligência de Negócio</span>
        <div class="prog-track">
          <div class="prog-fill" id="prog-fill"></div>
        </div>
        <span class="q-counter" id="q-counter">1 / 20</span>
      </div>
      <div id="q-area"></div>
    </div>

    <!-- RESULTS -->
    <div id="results"></div>

    <script>
      // ═══════════════════════════════════════════════════
      //  ⚠️  COLE AQUI A URL DO SEU APPS SCRIPT
      //  Depois de publicar o Apps Script, substitua a
      //  string abaixo pela URL gerada (começa com
      //  https://script.google.com/macros/s/...)
      // ═══════════════════════════════════════════════════
      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzf1nB4W5sZvzVgMDV6mphYDoJfDwIim6-UERpeQ4nQrEZpkPOGmUBso8yPI3pzLQ0h/exec";

      const questions = [
        {
          topic: "Visão geral de BI",
          text: "Qual é o principal objetivo da Inteligência de Negócio (BI)?",
          opts: [
            "Substituir analistas humanos por sistemas automatizados de decisão",
            "Transformar dados brutos em informações que apoiem a tomada de decisão estratégica",
            "Armazenar grandes volumes de dados históricos para auditorias futuras",
            "Criar relatórios financeiros obrigatórios para órgãos reguladores",
          ],
          answer: 1,
          exp: "BI é um conjunto de processos, tecnologias e ferramentas que transforma dados brutos em informação significativa para apoiar decisões de negócio — não substitui o tomador de decisão, mas o subsidia.",
        },
        {
          topic: "Fundamentos de BI",
          text: "Na pirâmide do conhecimento (DIKW), qual é a relação correta entre dados e informação?",
          opts: [
            "Informação é um subconjunto dos dados, com menor volume e maior redundância",
            "Dados são fatos brutos sem contexto; informação é o resultado de processar e contextualizar esses dados",
            "Dados e informação são sinônimos utilizados indistintamente na literatura de BI",
            "Informação precede os dados, pois define quais dados devem ser coletados",
          ],
          answer: 1,
          exp: "Na hierarquia DIKW (Data → Information → Knowledge → Wisdom), dados são fatos brutos e descontextualizados. Quando organizados e interpretados com contexto, tornam-se informação.",
        },
        {
          topic: "Fundamentos de BI",
          text: "Um data warehouse se diferencia de um banco de dados transacional (OLTP) principalmente porque:",
          opts: [
            "Armazena apenas dados em tempo real e é otimizado para escrita frequente",
            "É orientado a assuntos, integrado, variável no tempo e não volátil — otimizado para análise",
            "Utiliza exclusivamente a linguagem NoSQL para garantir escalabilidade horizontal",
            "Substitui completamente os sistemas OLTP ao centralizar operações e análises",
          ],
          answer: 1,
          exp: "Bill Inmon definiu o data warehouse pelas quatro características: orientado a assunto, integrado, variável no tempo e não volátil. Diferente do OLTP, é otimizado para consultas analíticas complexas (OLAP), não para transações.",
        },
        {
          topic: "Dashboards",
          text: "Qual princípio de design de dashboards está sendo violado quando um painel exibe 15 KPIs simultaneamente com gráficos de pizza, barras, linhas e tabelas em uma única tela?",
          opts: [
            "Princípio da consistência cromática",
            "Princípio da carga cognitiva mínima",
            "Princípio da hierarquia de fontes de dados",
            "Princípio da interoperabilidade de sistemas",
          ],
          answer: 1,
          exp: "Dashboards eficazes respeitam os limites da carga cognitiva humana. Exibir muitos elementos visuais distintos simultaneamente sobrecarrega o usuário e dificulta a identificação do insight principal.",
        },
        {
          topic: "Dashboards",
          text: "Um dashboard estratégico, um dashboard tático e um dashboard operacional se diferenciam principalmente em:",
          opts: [
            "Volume de dados processados, sendo o estratégico o que processa mais dados por segundo",
            "Público-alvo, horizonte temporal e nível de detalhe das informações exibidas",
            "Tipo de banco de dados utilizado como fonte: relacional, NoSQL ou em nuvem",
            "Frequência de atualização, sendo o estratégico atualizado em tempo real",
          ],
          answer: 1,
          exp: "Dashboards estratégicos são voltados à alta gestão, com visão de longo prazo e alto nível de agregação. Táticos focam em gerentes médios com horizonte de médio prazo. Operacionais são para equipes de execução, com dados granulares e atualizações frequentes.",
        },
        {
          topic: "Tomada de decisão",
          text: "O modelo de Simon para tomada de decisão divide o processo em três fases. Qual sequência está correta?",
          opts: [
            "Escolha → Inteligência → Design",
            "Inteligência → Design → Escolha",
            "Design → Inteligência → Implementação",
            "Análise → Síntese → Avaliação",
          ],

      let currentQ = 0;
      let selectedOpt = null;
      let confirmed = false;
      let userAnswers = [];
      let studentName = "";

      function startQuiz() {
        const nameInput = document.getElementById("student-name");
        const nameError = document.getElementById("name-error");
        studentName = nameInput.value.trim();

        if (!studentName || studentName.length < 3) {
          nameInput.classList.add("error");
          nameError.classList.add("visible");
          nameInput.focus();
          return;
        }

        nameInput.classList.remove("error");
        nameError.classList.remove("visible");
        document.getElementById("cover").style.display = "none";
        document.getElementById("quiz-shell").style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        selectedOpt = null;
        confirmed = false;
        const q = questions[currentQ];
        updateProgress();

        const letters = ["A", "B", "C", "D"];
        const optsHtml = q.opts
          .map(
            (o, i) => `
    <button class="opt-btn" onclick="selectOpt(${i})" id="opt-${i}">
      <span class="opt-letter">${letters[i]}</span>
      <span>${o}</span>
    </button>
  `,
          )
          .join("");

        document.getElementById("q-area").innerHTML = `
    <div class="q-block">
      <div class="q-topic">${q.topic}</div>
      <div class="q-num">Questão ${currentQ + 1} de ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="options-list">${optsHtml}</div>
      <div class="feedback-box" id="feedback"></div>
      <div class="q-nav">
        <button class="btn-confirm" id="btn-confirm" onclick="confirmAnswer()" disabled>Confirmar</button>
      </div>
    </div>
  `;
      }

      function selectOpt(i) {
        if (confirmed) return;
        selectedOpt = i;
        document.querySelectorAll(".opt-btn").forEach((b, idx) => {
          b.classList.toggle("selected", idx === i);
        });
        document.getElementById("btn-confirm").disabled = false;
      }

      function confirmAnswer() {
        if (selectedOpt === null || confirmed) return;
        confirmed = true;

        const q = questions[currentQ];
        const isCorrect = selectedOpt === q.answer;
        userAnswers[currentQ] = {
          selected: selectedOpt,
          correct: q.answer,
          isCorrect,
        };

        document.querySelectorAll(".opt-btn").forEach((b, i) => {
          b.disabled = true;
          b.classList.remove("selected");
          if (i === q.answer)
            b.classList.add(
              isCorrect && i === selectedOpt ? "correct" : "reveal-correct",
            );
          if (i === selectedOpt && !isCorrect) b.classList.add("wrong");
          if (i === selectedOpt && isCorrect) b.classList.add("correct");
        });

        const fb = document.getElementById("feedback");
        fb.className =
          "feedback-box visible " + (isCorrect ? "fb-correct" : "fb-wrong");
        fb.innerHTML = `<div class="fb-label">${isCorrect ? "✓ Correto" : "✗ Incorreto"}</div>${q.exp}`;

        const nav = document.querySelector(".q-nav");
        const isLast = currentQ === questions.length - 1;
        nav.innerHTML = `
    <button class="btn-next" onclick="${isLast ? "showResults()" : "nextQuestion()"}">
      ${isLast ? "Ver resultado →" : "Próxima →"}
    </button>
  `;
      }

      function nextQuestion() {
        currentQ++;
        renderQuestion();
      }

      function updateProgress() {
        const pct = (currentQ / questions.length) * 100;
        document.getElementById("prog-fill").style.width = pct + "%";
        document.getElementById("q-counter").textContent =
          `${currentQ + 1} / ${questions.length}`;
      }

      function showResults() {
        document.getElementById("quiz-shell").style.display = "none";
        const resultsEl = document.getElementById("results");
        resultsEl.style.display = "block";

        const total = questions.length;
        const correct = userAnswers.filter((a) => a.isCorrect).length;
        const wrong = total - correct;
        const pct = Math.round((correct / total) * 100);

        const verdicts = [
          [90, "Excelente domínio do conteúdo."],
          [70, "Bom desempenho, mas há pontos a revisar."],
          [50, "Desempenho regular — revise os tópicos em vermelho."],
          [0, "É hora de revisar o material com atenção."],
        ];
        const verdict = verdicts.find((v) => pct >= v[0])[1];
        const letters = ["A", "B", "C", "D"];

        const reviewItems = questions
          .map((q, i) => {
            const ua = userAnswers[i];
            const statusCls = ua.isCorrect ? "status-c" : "status-w";
            const statusIcon = ua.isCorrect ? "✓" : "✗";
            const yourAns = `${letters[ua.selected]}) ${q.opts[ua.selected]}`;
            const corrAns = `${letters[q.answer]}) ${q.opts[q.answer]}`;
            const wrongBlock = ua.isCorrect
              ? ""
              : `
      <div class="review-your">Sua resposta</div>
      <div class="review-your-val">${yourAns}</div>
      <div class="review-correct-ans">Resposta correta</div>
      <div class="review-correct-ans-val">${corrAns}</div>
    `;
            return `
      <div class="review-item">
        <div class="review-header" onclick="toggleReview(this)">
          <span class="review-status ${statusCls}">${statusIcon} Q${i + 1}</span>
          <span class="review-qtext">${q.text}</span>
        </div>
        <div class="review-body">
          ${wrongBlock}
          <div class="review-exp">${q.exp}</div>
        </div>
      </div>
    `;
          })
          .join("");

        resultsEl.innerHTML = `
    <div class="result-hero">
      <div class="score-label">Sua pontuação</div>
      <div class="score-big">${pct}<span style="font-size:2rem">%</span></div>
      <div class="score-verdict">${verdict}</div>
      <div class="score-sub">${correct} acertos de ${total} questões · ${studentName}</div>
    </div>
    <div class="result-breakdown">
      <div class="breakdown-cell bc-green"><div class="bc-val">${correct}</div><div class="bc-lbl">Corretas</div></div>
      <div class="breakdown-cell bc-red"><div class="bc-val">${wrong}</div><div class="bc-lbl">Erradas</div></div>
      <div class="breakdown-cell bc-gold"><div class="bc-val">${pct}%</div><div class="bc-lbl">Aproveitamento</div></div>
    </div>

    <div class="send-box">
      <h3>Enviar resultado ao professor</h3>
      <p>Clique abaixo para registrar suas respostas na planilha da turma.<br>Você só precisa fazer isso uma vez.</p>
      <div class="send-name-display">Enviando como: <strong>${studentName}</strong></div>
      <button class="btn-send" id="btn-send" onclick="sendResults(${correct}, ${wrong}, ${pct})">
        Enviar resultado →
      </button>
      <div class="send-status" id="send-status"></div>
    </div>

    <h2 class="review-title">Revisão das questões</h2>
    ${reviewItems}
    <button class="btn-restart" onclick="restartQuiz()">↺ Refazer avaliação</button>
  `;

        resultsEl.scrollIntoView({ behavior: "smooth" });
      }

      async function sendResults(correct, wrong, pct) {
        const btn = document.getElementById("btn-send");
        const status = document.getElementById("send-status");

        if (APPS_SCRIPT_URL === "COLE_AQUI_A_URL_DO_SEU_APPS_SCRIPT") {
          status.className = "send-status error";
          status.textContent =
            "⚠️ URL do Apps Script não configurada. Configure o arquivo index.html antes de publicar.";
          return;
        }

        btn.disabled = true;
        status.className = "send-status sending";
        status.textContent = "Enviando...";

        const payload = {
          name: studentName,
          score: pct,
          correct,
          wrong,
          answers: userAnswers.map((a) => a.selected),
        };

        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          status.className = "send-status success";
          status.textContent =
            "✓ Resultado enviado com sucesso! O professor já pode visualizar suas respostas.";
          btn.textContent = "Enviado ✓";
        } catch (err) {
          status.className = "send-status error";
          status.textContent =
            "✗ Erro ao enviar. Verifique sua conexão e tente novamente.";
          btn.disabled = false;
        }
      }

      function toggleReview(header) {
        header.nextElementSibling.classList.toggle("open");
      }

      function restartQuiz() {
        currentQ = 0;
        selectedOpt = null;
        confirmed = false;
        userAnswers = [];
        document.getElementById("results").style.display = "none";
        document.getElementById("results").innerHTML = "";
        document.getElementById("quiz-shell").style.display = "block";
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
  </body>
</html>
